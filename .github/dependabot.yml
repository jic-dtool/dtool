# Keep GitHub Actions and Python dependencies up to date. Updates are
# checked weekly, and all GitHub Actions updates are grouped into a single
# pull request. This file is identical in all dtool repositories.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
