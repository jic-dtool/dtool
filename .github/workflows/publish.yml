name: publish

# Pushing a version tag (e.g. 3.27.0) runs the test suite, then builds the
# package and publishes it to PyPI. The upload uses PyPI trusted publishing
# (OIDC), so no API tokens are stored in the repository.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        # hatch-vcs derives the version from the git tags
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Package distribution
      run: |
        pip install --upgrade build
        python -m build

    - name: Check version matches tag
      run: |
        ls "dist/dtool-${GITHUB_REF_NAME}.tar.gz" \
           "dist/dtool-${GITHUB_REF_NAME}-py3-none-any.whl"

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dtool
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
