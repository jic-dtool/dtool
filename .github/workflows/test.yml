name: test

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Git checkout
      uses: actions/checkout@v7

    - name: Set up python3 ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install .[test]
        pip list

    - name: Test with pytest
      run: |
        pytest -sv --cov-report=xml --cov-report=term-missing

    - name: Coverage summary
      run: |
        {
          echo "### Coverage (Python ${{ matrix.python-version }})"
          # The pinned packages are installed: drop the site-packages prefix.
          python -m coverage report --format=markdown \
            | sed -E 's#[^| ]*/site-packages/##'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-py${{ matrix.python-version }}
        path: coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: py${{ matrix.python-version }}
        fail_ci_if_error: false

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics