[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dtool"
description = "dtool command line client for managing data"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.rst"]
authors = [
    {name = "Tjelvar Olsson", email = "tjelvar.olsson@gmail.com"}
]
requires-python = ">=3.10"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "dtoolcore==3.19.0",
    "dtool-cli==0.7.2",
    "dtool-create==0.23.4",
    "dtool-info==0.16.2",
    "dtool-symlink==0.3.1",
    "dtool-http==0.5.1",
    "dtool-config==0.4.1",
    "dtool-overlay==0.3.1",
    "dtool-annotation==0.1.1",
    "dtool-tag==0.1.1"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov"
]
docs = [
    "sphinx",
    "sphinx_rtd_theme"
]

[project.urls]
Documentation = "https://dtool.readthedocs.io"
Repository = "https://github.com/jic-dtool/dtool"
Changelog = "https://github.com/jic-dtool/dtool/blob/main/CHANGELOG.rst"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "dtool/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dtool"]
