[flake8]
exclude=env*,.tox,.git,*.egg,build,docs

[tool:pytest]
testpaths = tests
addopts = --cov=dtool --cov=dtoolcore --cov=dtool_cli --cov=dtool_create --cov=dtool_info --cov=dtool_http --cov=dtool_config --cov=dtool_overlay --cov=dtool_annotation --cov=dtool_tag --cov=dtool_symlink
#addopts = -x --pdb

[coverage:run]
# Generated by hatch-vcs at build time; contains no logic.
omit = */version.py
